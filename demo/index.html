<!doctype html>
<html lang="zh-CN" data-theme="powder">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8edf1">
  <title>Sillage Focus Pomodoro</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="phone-shell">
    <header>
      <div><small>SILLAGE LAB</small><h1>今天也抱稳一小会儿</h1></div>
      <button id="theme-toggle" type="button">切到 Angel</button>
    </header>
    <section class="intro">
      <span>🐾</span>
      <p>开始专注后，把 iPhone 钉在当前 PWA。游戏先等等，小猫陪你把这一颗做完。</p>
    </section>
    <div id="focus-pomodoro"></div>
    <section class="ai-card">
      <div><small>AI 可读状态</small><strong>发送消息时实时生成</strong></div>
      <button id="copy-prompt" type="button">复制状态</button>
    </section>
    <pre id="prompt-preview"></pre>
  </main>
  <script src="../src/sillage-pomodoro.js"></script>
  <script src="./demo.js"></script>
</body>
</html>
